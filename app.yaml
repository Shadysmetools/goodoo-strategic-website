runtime: nodejs20
service: default

env_variables:
  NODE_ENV: production
  JWT_SECRET: "your-secret-key-here"

handlers:
  - url: /_next/static
    static_dir: .next/static
    secure: always

  - url: /uploads
    static_dir: public/uploads
    secure: always

  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 10

resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10 