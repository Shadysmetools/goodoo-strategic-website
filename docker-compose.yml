services:
  web:
    build: .
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your_jwt_secret_here
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
    restart: unless-stopped

  # Optional: Add a development service
  web-dev:
    build: .
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=your_jwt_secret_here
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    command: npm run dev
    profiles:
      - dev 